server:
  port: 8080

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/auth/**
        - id: product-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/productos/**
        - id: movement-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/movimientos/**
